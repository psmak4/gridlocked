name: Deploy staging

# Manual only. Run it from the Actions tab (or `gh workflow run deploy-staging.yml`).
# It takes the code to the Neon project `gridlocked-staging`, branch `main` or,
# for the closed beta (docs/runbooks/beta.md), `beta`: migrations, the data a
# new database needs (main: an optional import of the 2026 season; beta: the
# seeded game and the beta notice), and the `tick` function with its two
# triggers (neon.ts). Once the Vercel project exists (VERCEL_TOKEN is set), it
# also builds the website and deploys it to `gridlocked-staging`, unless the
# site belongs to the other target (the BETA_RUNNING variable says which).
on:
  workflow_dispatch:
    inputs:
      target:
        description: The Neon branch (beta needs BETA_RUNNING and DATABASE_URL_BETA)
        type: choice
        options: [main, beta]
        default: main
      import_2026:
        description: main only. Import the recorded 2026 season (refuses a database that has polled live data)
        type: boolean
        default: false
      seed_beta:
        description: beta only, once. Seed the game into the empty database and start the replay's clock
        type: boolean
        default: false
      first_friday:
        description: With seed_beta, the first beta Friday as yyyy-mm-dd (round 1's Friday lands on it)
        type: string
        required: false

permissions:
  contents: read

# Two deploys at once would race on migrations and on the function.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Pinned: the version of the `neon` CLI from npm that this workflow uses.
  NEON_CLI_VERSION: 8.13.2
  # Pinned: the version of the `vercel` CLI from npm that this workflow uses.
  VERCEL_CLI_VERSION: 65.2.0
  NEON_PROJECT_ID: ancient-fog-03461181
  NEON_BRANCH: ${{ inputs.target }}

jobs:
  deploy:
    # Only the reviewed code on main goes to staging, whatever ref was picked.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the staging secrets: NEON_API_KEY_STAGING, DATABASE_URL_STAGING,
    # DATABASE_URL_BETA (for the beta) and,
    # once Resend is approved, RESEND_API_KEY and EMAIL_FROM, and for Web Push
    # VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY (neon.ts declares each pair for the
    # function only when both are set). The website adds the secret
    # VERCEL_TOKEN and the variables VERCEL_ORG_ID, VERCEL_PROJECT_ID and
    # VITE_TURNSTILE_SITE_KEY. The site's own settings (BETTER_AUTH_SECRET,
    # DATABASE_URL and so on) live in the Vercel project, not here.
    environment: staging
    steps:
      # The inputs must suit the target, and the beta must be switched on:
      # names only. Inputs reach the shell through the environment.
      - name: Check the target
        run: |
          failed=""
          fail() { echo "::error::$1"; failed=1; }
          if [ "$TARGET" = "beta" ]; then
            [ "$BETA_RUNNING" = "true" ] || fail "The staging variable BETA_RUNNING is not true: the site still belongs to main (docs/runbooks/beta.md)"
            [ -n "$DATABASE_URL_BETA" ] || fail "The staging secret DATABASE_URL_BETA is not set (docs/runbooks/beta.md)"
            [ "$IMPORT_2026" != "true" ] || fail "import_2026 is for main: it loads every result at once. Seed the beta with seed_beta"
            [ "$SEED_BETA" != "true" ] || [ -n "$FIRST_FRIDAY" ] || fail "seed_beta needs first_friday"
          else
            [ "$SEED_BETA" != "true" ] || fail "seed_beta is for target beta"
          fi
          [ -z "$failed" ]
        env:
          TARGET: ${{ inputs.target }}
          IMPORT_2026: ${{ inputs.import_2026 }}
          SEED_BETA: ${{ inputs.seed_beta }}
          FIRST_FRIDAY: ${{ inputs.first_friday }}
          BETA_RUNNING: ${{ vars.BETA_RUNNING }}
          DATABASE_URL_BETA: ${{ secrets.DATABASE_URL_BETA }}

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must come before setup-node so `cache: pnpm` can find the pnpm binary.
      # Reads the version from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The direct (unpooled) URL of the target's branch. Prints the
      # migrations it applied. Safe to run again.
      - name: Run migrations
        run: pnpm db:migrate:staging
        env:
          DATABASE_URL: ${{ inputs.target == 'beta' && secrets.DATABASE_URL_BETA || inputs.target == 'main' && secrets.DATABASE_URL_STAGING || '' }}

      # Refuses a database that has polled live data (provider_requests is not
      # empty), so it cannot overwrite newer results.
      - name: Import the 2026 season
        if: ${{ inputs.target == 'main' && inputs.import_2026 }}
        run: pnpm import:2026
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      # Refuses a database that isn't empty, and writes nothing unless it all
      # succeeds (src/providers/replay/seed-beta.ts).
      - name: Seed the beta
        if: ${{ inputs.target == 'beta' && inputs.seed_beta }}
        run: pnpm seed:beta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BETA }}
          CLOCK_MODE: replay
          BETA_FIRST_FRIDAY: ${{ inputs.first_friday }}
          STAFF_ACTOR: ${{ github.triggering_actor }}

      # Safe to run again: an already published version writes nothing. It
      # fails on a database with no replay clock, so an unseeded beta stops
      # here, before its tick is deployed.
      - name: Publish the beta notice
        if: ${{ inputs.target == 'beta' }}
        run: pnpm legal:publish beta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BETA }}
          CLOCK_MODE: replay

      - name: Install the Neon CLI
        run: npm install --global "neon@${NEON_CLI_VERSION}"

      # A dry run: what the deploy below would change to the buckets, the
      # function and the triggers. It gets only the API key (and the project
      # id above): no step is handed a secret it doesn't use. neon.ts
      # declares the email and push secrets only when they are set, so the
      # plan doesn't list them; the deploy below passes them.
      - name: Plan the Neon deploy
        run: neon config plan --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}
          CLOCK_MODE: ${{ inputs.target == 'beta' && 'replay' || 'system' }}

      # Applies neon.ts: the `scheduler`, `exports` and `chat-archives`
      # buckets (a missing one is created), the `tick` function (bundled
      # from src/jobs/functions/tick.ts) and the two schedule triggers. The
      # email secrets reach the function through neon.ts; a missing secret is
      # passed as "" and neon.ts treats it as unset.
      # No --yes: if it would override branch settings or touch a protected
      # branch, it stops and names the flag.
      - name: Deploy the function and triggers
        run: neon deploy --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --no-env-pull
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Sentry (M9 Task 10): the tick reports its errors, scrubbed, when
          # the staging environment has a SENTRY_DSN variable.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ENVIRONMENT: ${{ inputs.target == 'beta' && 'beta' || 'staging' }}
          # The beta's tick runs on the replay's clock (neon.ts).
          CLOCK_MODE: ${{ inputs.target == 'beta' && 'replay' || 'system' }}

      # The function URL and the trigger ids only; never the environment.
      - name: Show the function and triggers
        run: |
          neon functions list --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --output json \
            | jq -r '(if type == "array" then . else (.functions // []) end)[] | "function \(.slug): \(.current_deployment.status // "unknown") \(.invocation_url)"'
          neon triggers list --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --output json \
            | jq -r '(if type == "array" then . else (.triggers // []) end)[] | "trigger \(.trigger_id) \(.name) cron=\(.schedule.cron // "-") path=\(.function_path) enabled=\(.enabled) next_run_at=\(.next_run_at // "-")"'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}

      # The website steps below run only when the Vercel token is set, so the
      # scheduler deploy above works on its own until then. They come last: a
      # failed site build never stops the migrations or the function.
      # The site has one address and one database, so it is deployed only with
      # the target it belongs to: during the beta, a deploy to main leaves it.
      - name: Check for the Vercel token
        id: vercel
        run: |
          site="main"
          [ "$BETA_RUNNING" != "true" ] || site="beta"
          if [ "$TARGET" != "$site" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The site belongs to $site (BETA_RUNNING), so the website build and deploy are skipped."
          elif [ -n "$VERCEL_TOKEN" ]; then
            # With the token set, the rest must be set too; names only.
            missing=""
            [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
            [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
            [ -n "$VITE_TURNSTILE_SITE_KEY" ] || missing="$missing VITE_TURNSTILE_SITE_KEY"
            if [ -n "$missing" ]; then
              echo "::error::These staging variables are not set:$missing"
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set in the staging environment, so the website build and deploy are skipped."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          TARGET: ${{ inputs.target }}
          BETA_RUNNING: ${{ vars.BETA_RUNNING }}

      # No VITE_LOCAL_DB: this is the deployed build, with no local database.
      # The vercel preset writes .vercel/output (Build Output API).
      - name: Build the website for Vercel
        if: steps.vercel.outputs.enabled == 'true'
        run: pnpm build
        env:
          NITRO_PRESET: vercel
          # Public, and read at build time.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # Sentry (M9 Task 10). The DSN, release and environment are built
          # into the browser's and the server's code; with no SENTRY_DSN
          # variable nothing reports. With SENTRY_AUTH_TOKEN (a secret) and
          # the SENTRY_ORG and SENTRY_PROJECT variables, the build uploads its
          # source maps to Sentry and deletes them.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.target == 'beta' && 'beta' || 'staging' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # The build must be a real Vercel output with none of the local-only
      # code: no PGlite (by path or by import) and the same markers CI greps
      # for in .output/server.
      - name: Check the website build
        if: steps.vercel.outputs.enabled == 'true'
        run: |
          if [ ! -f .vercel/output/config.json ]; then
            echo "::error::.vercel/output/config.json is missing"
            exit 1
          fi
          if [ -n "$(find .vercel/output \( -iname '*pglite*' -o -name '*.wasm' -o -name 'postgres.data' \))" ] || grep -rq '@electric-sql/pglite' .vercel/output; then
            echo "::error::.vercel/output contains PGlite"
            exit 1
          fi
          # The same list as CI's unflagged build, Task 13's and M6's hooks included.
          # Source maps go to Sentry, never to the browser (M9 Task 10).
          if [ -n "$(find .vercel/output/static -name '*.map')" ]; then
            echo "::error::.vercel/output/static contains source maps"
            exit 1
          fi
          for marker in migrationsFolder test-email-capture gl-test-busy \
            test-hook-ban-account test-hook-make-admin test-hook-impersonate \
            test-hook-run-exports test-hook-export-file \
            test-hook-clear-acceptances test-hook-game test-hook-clock \
            test-hook-community test-hook-staff; do
            if grep -rq "$marker" .vercel/output; then
              echo "::error::.vercel/output contains the local-only code ($marker)"
              exit 1
            fi
          done

      - name: Install the Vercel CLI
        if: steps.vercel.outputs.enabled == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # Deploys the output built above (--prebuilt); Vercel does not build.
      # --prod makes it the project's fixed address. The CLI reads the token
      # and the two ids from the environment. Prints the deployment URL.
      - name: Deploy the website
        if: steps.vercel.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
